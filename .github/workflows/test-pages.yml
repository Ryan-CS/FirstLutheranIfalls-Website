name: Deploy First Lutheran test site

on:
  push:
    branches:
      - migration/github-pages-worker-test
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: first-lutheran-test-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          shopt -s nullglob
          for file in *.html; do
            cp -- "$file" _site/
          done
          for file in robots.txt; do
            if [ -f "$file" ]; then cp -- "$file" _site/; fi
          done
          for dir in assets files gdpr posts uploads; do
            if [ -d "$dir" ]; then cp -R -- "$dir" "_site/$dir"; fi
          done
          printf '%s\n' 'firstlutheranifalls.site' > _site/CNAME
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
